name: CI

# The frontend's only mechanical check was `tsc --noEmit`, run by hand. That
# misses a whole class of failure that only appears at build time — a client
# component reading useSearchParams outside a Suspense boundary typechecks
# perfectly and fails the production build — so both run here.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24, the current LTS and what development runs on. 20 reached end of
          # life in April 2026, and it cannot run the TypeScript tests: `npm
          # test` relies on Node stripping types itself, which 20 does not do.
          node-version: '24'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins and fails if the lockfile and package.json have
      # drifted apart, which is the point of having a lockfile at all.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Warnings do not fail this. The config is narrow on purpose (see
        # eslint.config.mjs) so the first run passes on the existing codebase
        # — a linter that demands three hundred edits on day one is a linter
        # somebody switches off, and then it catches nothing at all.
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        # Plain `node --test`. There is no test framework to install: Node
        # runs the TypeScript directly.
        run: npm test

      - name: Build
        # NEXT_PUBLIC_* values are inlined at build time, so one is needed for
        # the build to complete. It is not the deployed value and does not have
        # to be reachable — nothing here makes a request. The real URL is set
        # in the hosting environment.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npx next build
