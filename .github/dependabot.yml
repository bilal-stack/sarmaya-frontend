version: 2

# Dependabot opens a pull request; CI decides whether it lands. Lint, typecheck
# and build all run on every PR, which is what makes an automated bump useful
# here rather than a thing somebody has to manually re-verify.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next, React and the type packages move together often enough that
      # separate PRs for each would conflict with one another.
      next-and-react:
        patterns:
          - next
          - react
          - react-dom
          - '@types/react*'
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
